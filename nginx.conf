server {
    listen 7050;
    server_name localhost;
    root /usr/share/nginx/html;

    # The Life service has no full URL baked into the build (v_API_LIFE_URI), so the app calls
    # the relative /api/life and we forward it here, as the Vite dev proxy does.
    # LIFE_API_UPSTREAM is filled in when the container starts (see Dockerfile).
    location /api/life/ {
        proxy_pass ${LIFE_API_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
