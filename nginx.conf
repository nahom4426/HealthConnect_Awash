server {
    listen 7050;
    server_name localhost;
    root /usr/share/nginx/html;

    # Security headers (Marine plan section 9, FE-49). The Content Security Policy is report-only
    # until every module has been checked against it; switch the header name to
    # Content-Security-Policy to enforce it. connect-src stays open because the backend hosts
    # come from the .env files.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https: http:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;

    # The Life service has no full URL baked into the build (v_API_LIFE_URI), so the app calls
    # the relative /api/life and we forward it here, as the Vite dev proxy does.
    # LIFE_API_UPSTREAM is filled in when the container starts (see Dockerfile).
    location /api/life/ {
        proxy_pass ${LIFE_API_UPSTREAM};
        proxy_ssl_server_name on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
